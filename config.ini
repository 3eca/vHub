# ============================
# [Default] - General settings
# ============================
[Default]
# admin_name: System administrator's name. Initiated at the first service startup.
admin_name = admin

# admin_password: System administrator's password. Initiated at the first service startup.
admin_password = vhub


# ============================
# [Email] - Email settings
# ============================
[Email]
# email: Enable or disable email sending (true/false).
email = false

# host: SMTP server address for sending emails. Example, host = 192.168.0.3 or host = smtp.gmail.com
# host = 

# port: SMTP server port.
# port = 

# user: Login for connecting to the SMTP server. Example, user = admin@gmail.com
# user = 

# password: Password for connecting to the SMTP server.
# password = 


# ============================
# [LDAP] - LDAP settings
# ============================
[LDAP]
# ldap: Enable or disable LDAP usage (true/false).
ldap = false

# host: IP address or domain name of the LDAP server. Example, host = 192.168.0.4 or host = ldap.example.com
# host = 

# port: Port. Example, 389 or 3268
# port = 

# bind_dn: DN of the account used to bind to the LDAP server. Example, 
# openldap\freeipa: bind_dn = uid=admin,cn=users,cn=accounts,dc=example,dc=com, 
# AD: bind_dn = CN=admin,CN=Users,DC=ad,DC=local
# bind_dn = 

# bind_password: Password for binding to the LDAP server.
# bind_password = 

# base_dn: Base DN for searching records in LDAP. Example, openldap\freeipa: base_dn = dc=example,dc=com, AD: base_dn = DC=example,DC=com
# base_dn = 

# group_dn: DN for searching groups in LDAP. Example, openldap\freeipa: group_dn = cn=groups,cn=accounts, AD: group_dn = OU=vhub
# group_dn = 

# group_filter: Filter for searching groups in LDAP. Example, openldap\freeipa: user_filter = (objectClass=posixgroup), AD: user_filter = (objectClass=group)
# group_filter = 

# group_access_attr: Attribute containing the list of groups to which the user is assigned. Example, group_access_attr = memberOf
# group_access_attr = 

# group_access: Name of the group that has access to the system.
# The complete user group membership string consists of "<group_access>,<group_dn>,<base_dn>"
# Example, openldap\freeipa: group_access = cn=vhub, AD: group_access = CN=access
# group_access = 

# user_dn: DN for searching users in LDAP. Example, openldap\freeipa: user_dn = cn=users,cn=accounts, AD: user_dn = CN=Users
# user_dn = 

# user_login_attr: Attribute used for user login (e.g., uid). Example, openldap\freeipa: user_login_attr = uid, AD: user_login_attr = sAMAccountName
# user_login_attr = 

# user_email: Attribute mail user. Example, openldap\freeipa: user_email = mail, AD: user_email = userPrincipalName
# user_email = 

# user_filter: Filter for searching users in LDAP. Example, openldap\freeipa: user_filter = (objectClass=inetorgperson), AD: user_filter = (objectClass=user)
# user_filter = 


# ============================
# [Minio] - MinIO settings
# ============================
[Minio]
# host: IP address or domain name of the MinIO server. Example, host = 192.168.0.5 or host = minio.example.com
host = 172.28.1.3

# port: MinIO server port.
port = 9000

# bucket: Name of the bucket in MinIO. Initiated at the first service startup.
bucket = vhub

# user: Login for connecting to MinIO. Initiated at the first service startup.
user = vhub-minio

# password: Password for connecting to MinIO. Initiated at the first service startup.
password = vhub-minio


# ============================
# [MySQL] - MySQL settings
# ============================
[MySQL]
# host: IP address or domain name of the MySQL server. Example, host = 192.168.0.6 or host = mysql.example.com
host = 172.28.1.2

# port: MySQL server port. Initiated at the first service startup.
port = 3306

# database: Name of the database. Initiated at the first service startup.
database = vhub

# user: Login for connecting to MySQL. Default user.
user = root

# password: Password for connecting to MySQL. Initiated at the first service startup.
password = vhub-mysql


# ============================
# [Video] - Video settings
# ============================
[Video]
# shared: Enable or disable shared access to videos (true/false).
shared = false

# time: Time (in days) for which videos will be stored.
# time = 7